server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:8020/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /static/ {
        root /usr/share/nginx/html;
        try_files $uri @django_static;
        access_log off;
        expires 30d;
    }
    location @django_static {
        root /var/www;
        access_log off;
    }

    # The page every route falls back to. Without an explicit rule browsers
    # guess how long to reuse it, and a reused copy keeps loading the previous
    # build's JavaScript (2026-09-21: users stuck on the broken 09-19 build).
    # no-cache = re-check every visit; unchanged copies come back as a cheap 304.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
