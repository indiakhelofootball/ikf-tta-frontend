# Local-only override: adds a throwaway MySQL 8.4 so the whole stack runs on your
# machine with no external DB. On the server this file is NOT used (host MySQL instead).
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# The environment: block here overrides DB_* from the backend .env so the backend
# talks to the "db" service instead of host MySQL.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: tta_db
      MYSQL_USER: tta_user
      MYSQL_PASSWORD: ttapw
    ports:
      # Loopback only — this volume holds a copy of production data and the root
      # password is trivial, so it must not be reachable from the local network.
      - "127.0.0.1:13306:3306"
    volumes:
      - tta_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-prootpw"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    environment:
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: tta_db
      DB_USER: tta_user
      DB_PASSWORD: ttapw
      DB_HOST: db
      DB_PORT: "3306"
    depends_on:
      db:
        condition: service_healthy

volumes:
  tta_db_data:
