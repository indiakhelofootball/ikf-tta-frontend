server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:8020/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /static/ {
        root /usr/share/nginx/html;
        try_files $uri @django_static;
        access_log off;
        expires 30d;
    }
    location @django_static {
        root /var/www;
        access_log off;
    }

    # G3 BEGIN -- the funder portal is a separate bundle (build-client/), copied
    # to /usr/share/nginx/html/client by the Dockerfile. Without these two blocks
    # /client falls through to `location /` and funders are served the STAFF
    # bundle (SEC2, live until 2026-10). `^~` keeps /client/static/... away from
    # the /static/ block above. The shell is re-checked every visit and the
    # hashed assets are cached, the same split as the staff app below. Every
    # portal route reaches the shell through the exact /client/index.html match,
    # so its header is set in one place (an add_header in /client/ itself would
    # be inherited by the assets block too).
    location = /client {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /client/index.html =404;
    }
    location = /client/index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location ^~ /client/ {
        location ~ ^/client/static/(js|css|media)/ {
            access_log off;
            expires 30d;
        }
        try_files $uri $uri/ /client/index.html;
    }
    # G3 END

    # The page every route falls back to. Without an explicit rule browsers
    # guess how long to reuse it, and a reused copy keeps loading the previous
    # build's JavaScript (2026-09-21: users stuck on the broken 09-19 build).
    # no-cache = re-check every visit; unchanged copies come back as a cheap 304.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
