server{
    listen 80;
    server_name www.tta.indiakhelofootball.com tta.indiakhelofootball.com;
    return 301 https://tta.indiakhelofootball.com$request_uri;
}

server {
    listen 443;
    server_name www.tta.indiakhelofootball.com tta.indiakhelofootball.com;
    client_max_body_size 16M;

    root /root/TTA/frontend/ikf-tta-frontend/build;
    index index.html;

    # Serve React frontend
    # index.html must never be cached — it references hashed JS/CSS bundles.
    # After a deploy, browsers must fetch the new index.html to get new bundle URLs.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Hashed static assets (JS, CSS, media) — cache aggressively
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Django backend
    location /api/ {
        include proxy_params;
        proxy_pass http://unix:/run/tta.sock;
    }

    # Proxy admin requests to Django backend
    location /admin/ {
        include proxy_params;
        proxy_pass http://unix:/run/tta.sock;
    }

    # Serve Django static files for admin
    location /static/admin/ {
        include proxy_params;
        proxy_pass http://unix:/run/tta.sock;
    }

    ssl on;
    ssl_certificate /etc/letsencrypt/live/indiakhelofootball.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indiakhelofootball.com/privkey.pem;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
}
