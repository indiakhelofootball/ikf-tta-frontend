# Serves the built React app and reverse-proxies API + Django static to the backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;   # REP logos / MOU uploads travel as base64 in JSON

    # API -> gunicorn backend (service name "backend" on the compose network)
    location /api/ {
        proxy_pass http://backend:8020/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # React build assets. CRA emits these under /static/js, /static/css and
    # /static/media, which collides with Django's STATIC_URL of /static/. A regex
    # location outranks the prefix location below, so these three subtrees are
    # claimed for React and everything else under /static/ falls through to Django.
    # Without this the /staticfiles/ alias swallows main.<hash>.js and the app
    # renders a blank page.
    location ~ ^/static/(js|css|media)/ {
        root /usr/share/nginx/html;
        access_log off;
        # Filenames are content-hashed, so they can never go stale.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Django static (admin, DRF browsable API) from the shared volume.
    location /static/ {
        alias /staticfiles/;
        access_log off;
        expires 30d;
    }

    # The SPA shells must never be cached: they carry the hashed asset names, so a
    # stale copy points at assets that no longer exist (blank page after a deploy).
    location ~ ^/(index|client)\.html$ {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # React SPA: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
