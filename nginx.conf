# Serves the built React app and reverse-proxies API + Django static to the backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;   # REP logos / MOU uploads travel as base64 in JSON

    # API -> gunicorn backend (service name "backend" on the compose network)
    location /api/ {
        proxy_pass http://backend:8020/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # React build assets. CRA emits these under /static/js, /static/css and
    # /static/media, which collides with Django's STATIC_URL of /static/. A regex
    # location outranks the prefix location below, so these three subtrees are
    # claimed for React and everything else under /static/ falls through to Django.
    # Without this the /staticfiles/ alias swallows main.<hash>.js and the app
    # renders a blank page.
    location ~ ^/static/(js|css|media)/ {
        root /usr/share/nginx/html;
        access_log off;
        # Filenames are content-hashed, so they can never go stale.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Django static (admin, DRF browsable API) from the shared volume.
    location /static/ {
        alias /staticfiles/;
        access_log off;
        expires 30d;
    }

    # ── G3: the funder portal is a SEPARATE bundle ────────────────────────────
    # Route-gating hides an external funder's DATA; it never hid the internal
    # app's CODE. A single build shipped the whole staff bundle (~26 MB, five JS
    # chunks, including the bank-export format, the payment modals and the
    # permissions grid) to every corporate client who logged in. `npm run
    # build:client` produces a tree containing only the portal (~3.5 MB, one
    # chunk, zero internal modules); these two locations are what actually serve
    # it, and without them the separate build is dead code.
    #
    # `^~` stops nginx evaluating the regex locations above for this prefix, so
    # /client/static/... is served from the client tree and never mistaken for
    # Django static or the internal build's assets.
    #
    # The client build is emitted with PUBLIC_URL=/client, so its own asset
    # references already point inside this prefix — plain `root` resolves them
    # and no alias is needed.
    location = /client {
        # Bare /client is where the app lands after login. Without this exact
        # match it falls through to the internal SPA below and the funder is
        # served the staff bundle — the precise leak this section exists to stop.
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
        try_files /client/index.html =404;
    }

    location ^~ /client/ {
        # Hashed assets under /client/static/ are safe to cache hard; the shell
        # never is. Set it here rather than relying on the regex block below —
        # try_files re-enters location matching, so which rule wins depends on
        # the rewritten path, and /client was picking up a weaker `no-cache`
        # than the internal shell's `no-store`. Cloudflare has already served
        # stale chunks once on this deployment; the two shells must agree.
        location ~ ^/client/static/(js|css|media)/ {
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
        try_files $uri $uri/ /client/index.html;
    }

    # The SPA shells must never be cached: they carry the hashed asset names, so a
    # stale copy points at assets that no longer exist (blank page after a deploy).
    location ~ ^/(index\.html|client\.html|client/index\.html)$ {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # React SPA: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
